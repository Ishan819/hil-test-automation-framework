name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run sample suite
        run: hil-run scenarios/smoke.yaml
      - name: Run recovery suite with JUnit report
        run: hil-run scenarios/recovery.yaml --report-format junit --report reports/recovery.xml

  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python adapter and integration tests
        run: python -m pip install -e ".[dev]"
      - name: Configure C++ tests
        run: cmake -S cpp -B build/cpp -DHIL_BUILD_REPORTING_FIXTURE=ON
      - name: Build C++ tests
        run: cmake --build build/cpp --parallel 2
      - name: Verify pinned Protobuf generation
        run: cmake --build build/cpp --target check_python_proto --parallel 2
      - name: Run GoogleTest through CTest
        run: ctest --test-dir build/cpp --output-on-failure --no-tests=error
      - name: Capture native JSON results through the CLI
        run: hil-run --native-tests build/cpp/hil_bench_tests --report reports/native.json --quiet
      - name: Capture native JUnit results through the CLI
        run: hil-run --native-tests build/cpp/hil_bench_tests --report-format junit --report reports/native.xml --quiet
      - name: Verify filtered native execution
        run: hil-run --native-tests build/cpp/hil_bench_tests --native-filter 'SimulatedBenchTest.StartsWithSafeDefaults' --report reports/native-filtered.json --quiet
      - name: Write Python Protobuf report
        run: hil-run scenarios/smoke.yaml --report-format protobuf --report reports/smoke.pb
      - name: Write filtered native Protobuf report
        run: hil-run --native-tests build/cpp/hil_bench_tests --native-filter 'SimulatedBenchTest.Accepts*' --report-format protobuf --report reports/native-filtered.pb --quiet
      - name: Verify native and cross-language reporting integration
        env:
          HIL_NATIVE_TEST_BINARY: build/cpp/hil_bench_tests
          HIL_NATIVE_REPORTING_BINARY: build/cpp/hil_reporting_fixture
          HIL_PROTO_EXCHANGE_BINARY: build/cpp/hil_proto_exchange
        run: python -m pytest -q -m "native_integration or protobuf_integration"
