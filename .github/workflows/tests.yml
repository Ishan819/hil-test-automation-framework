name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run sample suite
        run: hil-run scenarios/smoke.yaml
      - name: Run recovery suite with JUnit report
        run: hil-run scenarios/recovery.yaml --report-format junit --report reports/recovery.xml

  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python adapter CLI
        run: python -m pip install -e .
      - name: Configure C++ tests
        run: cmake -S cpp -B build/cpp
      - name: Build C++ tests
        run: cmake --build build/cpp --parallel 2
      - name: Run GoogleTest through CTest
        run: ctest --test-dir build/cpp --output-on-failure --no-tests=error
      - name: Run GoogleTest through the Python CLI
        run: hil-run --native-tests build/cpp/hil_bench_tests --quiet
